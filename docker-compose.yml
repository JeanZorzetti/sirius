version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: sirius-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sirius
      POSTGRES_PASSWORD: sirius_password_change_me
      POSTGRES_DB: sirius_db
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=en_US.UTF-8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./prisma/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sirius -d sirius_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sirius-network

  # Redis Cache (Upstash alternative for local development)
  redis:
    image: redis:7-alpine
    container_name: sirius-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass redis_password_change_me
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - sirius-network

  # Sirius CRM Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: sirius-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Database
      DATABASE_URL: postgresql://sirius:sirius_password_change_me@postgres:5432/sirius_db?schema=public

      # Redis (for local development - use Upstash in production)
      UPSTASH_REDIS_REST_URL: http://redis:6379
      UPSTASH_REDIS_REST_TOKEN: redis_password_change_me

      # App
      NODE_ENV: production
      PORT: 3000
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: generate_a_secure_secret_here_minimum_32_chars

      # External APIs (add your own)
      # SENTRY_DSN: ""
      # RESEND_API_KEY: ""
      # STRIPE_SECRET_KEY: ""
      # OPENAI_API_KEY: ""

    ports:
      - "3000:3000"
    volumes:
      # Mount uploads directory (if needed)
      - ./uploads:/app/uploads
      # Mount public for PWA assets
      - ./public:/app/public
    networks:
      - sirius-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Adminer - Database Management UI
  adminer:
    image: adminer:latest
    container_name: sirius-adminer
    restart: unless-stopped
    depends_on:
      - postgres
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: nette
    networks:
      - sirius-network

  # Redis Commander - Redis Management UI
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: sirius-redis-commander
    restart: unless-stopped
    depends_on:
      - redis
    environment:
      REDIS_HOSTS: local:redis:6379:0:redis_password_change_me
    ports:
      - "8081:8081"
    networks:
      - sirius-network

  # Mailhog - Email Testing (optional)
  mailhog:
    image: mailhog/mailhog:latest
    container_name: sirius-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP server
      - "8025:8025" # Web UI
    networks:
      - sirius-network

networks:
  sirius-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
