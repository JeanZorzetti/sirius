<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradientes modernos -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="sGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="pGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f87171;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ef4444;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="iGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="nGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#34d399;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>

    <!-- Filtro de sombra suave -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Seta -->
    <marker id="arrowWhite" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="white"/>
    </marker>
  </defs>

  <!-- Background com gradiente -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Elementos decorativos de fundo -->
  <circle cx="100" cy="100" r="120" fill="white" opacity="0.03"/>
  <circle cx="1100" cy="530" r="150" fill="white" opacity="0.03"/>
  <circle cx="200" cy="500" r="80" fill="white" opacity="0.02"/>
  <circle cx="1000" cy="150" r="100" fill="white" opacity="0.02"/>

  <!-- Título principal -->
  <text x="600" y="100" font-family="Arial, sans-serif" font-size="64" font-weight="900" fill="white" text-anchor="middle" letter-spacing="2">
    SPIN SELLING
  </text>

  <!-- Subtítulo -->
  <text x="600" y="145" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#e0f2fe" text-anchor="middle" letter-spacing="1">
    Metodologia de Vendas Consultivas B2B
  </text>

  <!-- Linha decorativa -->
  <line x1="400" y1="165" x2="800" y2="165" stroke="#60a5fa" stroke-width="2" opacity="0.5"/>

  <!-- Container central do diagrama -->
  <g transform="translate(600, 400)">

    <!-- Linhas conectoras (atrás dos círculos) -->
    <line x1="0" y1="-140" x2="0" y2="-60" stroke="white" stroke-width="3" opacity="0.3"/>
    <line x1="140" y1="0" x2="60" y2="0" stroke="white" stroke-width="3" opacity="0.3"/>
    <line x1="0" y1="140" x2="0" y2="60" stroke="white" stroke-width="3" opacity="0.3"/>
    <line x1="-140" y1="0" x2="-60" y2="0" stroke="white" stroke-width="3" opacity="0.3"/>

    <!-- Círculo central SPIN -->
    <circle cx="0" cy="0" r="55" fill="#1e293b" opacity="0.8" filter="url(#shadow)"/>
    <circle cx="0" cy="0" r="53" fill="white" opacity="0.1"/>
    <text x="0" y="8" font-family="Arial, sans-serif" font-size="36" font-weight="900" fill="white" text-anchor="middle">
      SPIN
    </text>
    <text x="0" y="28" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#e0f2fe" text-anchor="middle">
      Framework
    </text>

    <!-- S - Situação (Topo) -->
    <g transform="translate(0, -180)" filter="url(#shadow)">
      <circle cx="0" cy="0" r="85" fill="url(#sGrad)"/>
      <circle cx="0" cy="0" r="83" fill="white" opacity="0.1"/>

      <!-- Ícone -->
      <circle cx="0" cy="-25" r="20" fill="white" opacity="0.2"/>
      <text x="0" y="-16" font-family="Arial, sans-serif" font-size="24" fill="white" text-anchor="middle">📊</text>

      <text x="0" y="15" font-family="Arial, sans-serif" font-size="42" font-weight="900" fill="white" text-anchor="middle">
        S
      </text>
      <text x="0" y="38" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="white" text-anchor="middle">
        Situação
      </text>
      <text x="0" y="56" font-family="Arial, sans-serif" font-size="13" fill="#dbeafe" text-anchor="middle">
        Contexto Atual
      </text>
    </g>

    <!-- P - Problema (Direita) -->
    <g transform="translate(180, 0)" filter="url(#shadow)">
      <circle cx="0" cy="0" r="85" fill="url(#pGrad)"/>
      <circle cx="0" cy="0" r="83" fill="white" opacity="0.1"/>

      <!-- Ícone -->
      <circle cx="0" cy="-25" r="20" fill="white" opacity="0.2"/>
      <text x="0" y="-16" font-family="Arial, sans-serif" font-size="24" fill="white" text-anchor="middle">❗</text>

      <text x="0" y="15" font-family="Arial, sans-serif" font-size="42" font-weight="900" fill="white" text-anchor="middle">
        P
      </text>
      <text x="0" y="38" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="white" text-anchor="middle">
        Problema
      </text>
      <text x="0" y="56" font-family="Arial, sans-serif" font-size="13" fill="#fee2e2" text-anchor="middle">
        Dores & Desafios
      </text>
    </g>

    <!-- I - Implicação (Baixo) -->
    <g transform="translate(0, 180)" filter="url(#shadow)">
      <circle cx="0" cy="0" r="85" fill="url(#iGrad)"/>
      <circle cx="0" cy="0" r="83" fill="white" opacity="0.1"/>

      <!-- Ícone -->
      <circle cx="0" cy="-25" r="20" fill="white" opacity="0.2"/>
      <text x="0" y="-16" font-family="Arial, sans-serif" font-size="24" fill="white" text-anchor="middle">⚠️</text>

      <text x="0" y="15" font-family="Arial, sans-serif" font-size="42" font-weight="900" fill="white" text-anchor="middle">
        I
      </text>
      <text x="0" y="38" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="white" text-anchor="middle">
        Implicação
      </text>
      <text x="0" y="56" font-family="Arial, sans-serif" font-size="13" fill="#fef3c7" text-anchor="middle">
        Custo & Impacto
      </text>
    </g>

    <!-- N - Necessidade (Esquerda) -->
    <g transform="translate(-180, 0)" filter="url(#shadow)">
      <circle cx="0" cy="0" r="85" fill="url(#nGrad)"/>
      <circle cx="0" cy="0" r="83" fill="white" opacity="0.1"/>

      <!-- Ícone -->
      <circle cx="0" cy="-25" r="20" fill="white" opacity="0.2"/>
      <text x="0" y="-16" font-family="Arial, sans-serif" font-size="24" fill="white" text-anchor="middle">✅</text>

      <text x="0" y="15" font-family="Arial, sans-serif" font-size="42" font-weight="900" fill="white" text-anchor="middle">
        N
      </text>
      <text x="0" y="38" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="white" text-anchor="middle">
        Necessidade
      </text>
      <text x="0" y="56" font-family="Arial, sans-serif" font-size="13" fill="#d1fae5" text-anchor="middle">
        Solução Ideal
      </text>
    </g>

    <!-- Setas direcionais com animação visual -->
    <g opacity="0.6">
      <path d="M 0,-55 L 0,-95" stroke="white" stroke-width="2" marker-end="url(#arrowWhite)"/>
      <path d="M 55,0 L 95,0" stroke="white" stroke-width="2" marker-end="url(#arrowWhite)"/>
      <path d="M 0,55 L 0,95" stroke="white" stroke-width="2" marker-end="url(#arrowWhite)"/>
      <path d="M -55,0 L -95,0" stroke="white" stroke-width="2" marker-end="url(#arrowWhite)"/>
    </g>

  </g>

  <!-- Badge informativo -->
  <g transform="translate(600, 610)">
    <rect x="-150" y="-20" width="300" height="40" rx="20" fill="white" opacity="0.15"/>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="white" text-anchor="middle">
      +53% Taxa de Conversão Comprovada
    </text>
  </g>
</svg>
