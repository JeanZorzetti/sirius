name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel in-progress runs for the same workflow + branch combination
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run ESLint
        run: npm run lint
        continue-on-error: false

  typecheck:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma Client
        run: npx prisma generate && npx prisma generate --schema prisma/whatsapp.prisma

      - name: Run TypeScript type check
        run: npx tsc --noEmit

  build:
    name: Build Application
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint, typecheck]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma Client
        run: npx prisma generate && npx prisma generate --schema prisma/whatsapp.prisma

      - name: Build Next.js app
        run: npx prisma generate && npx prisma generate --schema prisma/whatsapp.prisma && npx next build
        env:
          # Use build-time env vars if needed
          SKIP_ENV_VALIDATION: true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: .next
          retention-days: 7

  test-unit:
    name: Unit Tests (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint, typecheck]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma Client
        run: npx prisma generate && npx prisma generate --schema prisma/whatsapp.prisma

      - name: Run Vitest unit tests
        run: npm run test:unit
        env:
          CI: true

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./coverage/coverage-final.json
          flags: unittests
          fail_ci_if_error: false

  test-e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build]
    # ponytail: 17 specs (auth/CRUD/api) exigem Postgres real, que a CI não
    # provisiona — não bloqueia o PR até existir um service container de
    # banco aqui. Sobe quando alguém tratar isso como história própria.
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Generate Prisma Client
        run: npx prisma generate && npx prisma generate --schema prisma/whatsapp.prisma

      - name: Run Playwright tests
        run: npm run test:e2e --if-present
        env:
          CI: true
          # o webServer builda e sobe um Next.js real — só precisa resolver, não conectar
          DATABASE_URL: 'postgresql://user:password@localhost:5432/db'

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  # Código morto — sem `needs`: não depende de Prisma nem de build (FR-023, FR-024)
  dead-code:
    name: Dead Code Scan
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run dead-code scanner (modo relatório)
        run: node scripts/audit-dead-code.js

  # Database migration check
  db-migration-check:
    name: Database Migration Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma Client
        run: npx prisma generate && npx prisma generate --schema prisma/whatsapp.prisma

      - name: Validate Prisma schema
        run: npx prisma validate
        env:
          # prisma validate só precisa da URL resolver (não conecta) — sem isso, o job falha com P1012
          DATABASE_URL: 'postgresql://user:password@localhost:5432/db'

      - name: Check for migration drift
        run: npx prisma migrate diff --from-schema-datamodel prisma/schema.prisma --to-schema-datamodel prisma/schema.prisma --script
        continue-on-error: true

  # Security & Dependency Audit
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run npm audit
        run: npm audit --audit-level=high --production
        continue-on-error: true

  # Code quality with SonarCloud (optional)
  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    if: false  # Disabled by default - enable when SonarCloud is configured

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for better analysis

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # All checks passed
  all-checks-passed:
    name: All Checks Passed ✓
    runs-on: ubuntu-latest
    needs: [lint, typecheck, build, test-unit, dead-code, db-migration-check, security]
    # test-e2e roda com continue-on-error (17 specs exigem Postgres real, ver acima) —
    # de propósito fora daqui: não pode ser o job que decide se o PR passa
    if: always()

    steps:
      - name: Check results
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "❌ Some checks failed"
            exit 1
          else
            echo "✅ All checks passed!"
          fi

      - name: Send success notification
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "✅ CI passed for production commit ${{ github.sha }}"
          # Add Slack/Discord webhook notification here if needed

      - name: Send failure notification
        if: failure() && github.event_name == 'push'
        run: |
          echo "❌ CI failed for commit ${{ github.sha }}"
          # Add Slack/Discord webhook notification here if needed
